# Build the application image and publish it where a host can pull it.
#
# Hugging Face moved Docker Spaces behind a paid plan, so the release is a
# container image rather than a Space. GitHub's own registry holds it: public
# images there cost nothing and can be pulled without credentials, which keeps
# the hosting side free of a registry bill and free of a second secret.
#
# The image is tagged with the commit that produced it. A tag like "latest"
# alone would make it impossible to say afterwards which code is running,
# which is exactly what the Build Phase notes ask to be recorded.
name: publish image

on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    # Only a commit whose tests passed is worth publishing. A manual dispatch
    # carries no such result and is allowed through deliberately, because that
    # is what makes a rollback to an earlier commit possible.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the commit being published
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Work out the image name
        id: image
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Registry paths are lowercase; a repository name need not be.
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 only. The hosts this deploys to run on it, and building
          # for arm64 as well would double a build that already spends most of
          # its time installing TensorFlow.
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short }}
            ${{ steps.image.outputs.name }}:latest
          # Layers are cached between runs, so a change to the application code
          # does not reinstall TensorFlow.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "    ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "From commit ${{ steps.image.outputs.sha }}." >> "$GITHUB_STEP_SUMMARY"

      # Whether anything will now point the application at it.
      #
      # The deploy job below is gated on a repository variable, and a job that
      # GitHub skips writes nothing anywhere: the run goes green, the image is
      # published, and the running application carries on serving whatever it
      # was last given. That is a quiet way to be months out of date, and this
      # repository was exactly that - the interface was rebuilt and the
      # deployed site kept serving the previous one for a day before anybody
      # looked. So the summary says which of the two happened, and when it is
      # the second it gives the one command that fixes it.
      - name: Say whether this image will be deployed
        env:
          WIRED: ${{ vars.AZURE_DEPLOY }}
          APP: ${{ vars.AZURE_APP_NAME || 'tb-screening' }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'tb-screening' }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short }}
        run: |
          set -euo pipefail
          {
            echo ""
            if [ "${WIRED}" = "true" ]; then
              echo "The deploy job will now point the application at this image."
            else
              echo "### Published, not deployed"
              echo ""
              echo "\`AZURE_DEPLOY\` is not set to \`true\`, so nothing has pointed the"
              echo "running application at this image. It is still serving whichever one"
              echo "it was last given."
              echo ""
              echo "To deploy this image by hand, in Azure Cloud Shell:"
              echo ""
              echo "    az containerapp update \\"
              echo "        --name ${APP} --resource-group ${GROUP} \\"
              echo "        --image ${IMAGE}"
              echo ""
              echo "To have every future push deploy itself, see"
              echo "\`docs/deployment-azure.md\`, *Deploying from GitHub*."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Point the running application at the image just built.
  #
  # Separate from publishing, because publishing is useful on its own: an image
  # that exists can be deployed by hand, rolled back to, or pulled by somebody
  # else, and none of that should depend on this repository holding credentials
  # for one subscription.
  #
  # Gated on a repository variable rather than on the secret existing. A job
  # that fails whenever the credential is absent would put a red cross on every
  # push made from a fork or before the subscription is set up, and a red cross
  # that is always there teaches people to stop reading them. Set AZURE_DEPLOY
  # to true when the secret is in place; until then this is skipped and says so.
  deploy:
    needs: publish
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Point the application at the new image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
            sha="${{ github.event.workflow_run.head_sha || github.sha }}"
            image="ghcr.io/${repo}:${sha:0:12}"

            az containerapp update \
                --name "${{ vars.AZURE_APP_NAME || 'tb-screening' }}" \
                --resource-group "${{ vars.AZURE_RESOURCE_GROUP || 'tb-screening' }}" \
                --image "$image" \
                --output none

            echo "image=$image" >> "$GITHUB_ENV"

      - name: Wait for it to answer as itself
        env:
          HEALTH_URL: ${{ vars.AZURE_HEALTH_URL }}
        run: |
          set -uo pipefail
          # A deployment that reports success because a command returned is not
          # evidence of anything: the first revision of this application
          # answered HTTP 400 to every request while reporting itself Running.
          # What counts is /health/, which answers 200 only when the database
          # responds and the model has loaded.
          if [ -z "${HEALTH_URL}" ]; then
            echo "No AZURE_HEALTH_URL set, so the deployment is not verified here." \
                 >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for attempt in $(seq 1 40); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' "${HEALTH_URL}" || true)"
            if [ "$code" = "200" ]; then
              echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "    ${image}" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Healthy after ${attempt} checks:" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              sed 's/^/    /' /tmp/health.json >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "check ${attempt}: HTTP ${code:-no answer}"
            sleep 15
          done

          echo "The application did not report itself ready within ten minutes." >&2
          exit 1
